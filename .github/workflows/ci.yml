name: j2ll CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j2ll-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows cross-platform verification
            os: windows-latest
            artifact-suffix: windows
          - name: Linux native and beta acceptance
            os: ubuntu-latest
            artifact-suffix: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Grant Gradle wrapper execute bit
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ./gradlew

      - name: Run Windows unit tests
        if: runner.os == 'Windows'
        run: .\gradlew.bat test

      - name: Run Linux unit tests and non-skipping beta acceptance
        if: runner.os == 'Linux'
        run: ./gradlew test betaAcceptance

      - name: Run Windows obf-bench
        if: runner.os == 'Windows'
        run: .\gradlew.bat obfBench

      - name: Upload j2ll CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j2ll-ci-${{ matrix.artifact-suffix }}
          path: |
            build/cli/j2ll.jar
            build/dist/j2ll/**
            build/obf-bench/obf-bench-report.txt
            build/obf-bench/out/**/frontend-skips.txt
            build/obf-bench/out/**/obf-bench.jar
          if-no-files-found: warn

      - name: Upload rolling release CLI
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: j2ll-release-cli
          path: build/cli/j2ll.jar
          if-no-files-found: error

  release:
    name: Publish rolling release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified CLI
        uses: actions/download-artifact@v4
        with:
          name: j2ll-release-cli
          path: build/release-assets

      - name: Move rolling release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f j2ll-latest "$GITHUB_SHA"
          git push origin refs/tags/j2ll-latest --force

      - name: Publish j2ll latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: j2ll-latest
          name: j2ll latest
          body: |
            Automated rolling release for `${{ github.sha }}`.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            build/release-assets/j2ll.jar
