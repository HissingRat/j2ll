import java.util.concurrent.ConcurrentHashMap
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestOutputEvent
import org.gradle.api.tasks.testing.TestOutputListener
import org.gradle.api.tasks.testing.TestResult

plugins {
    id 'com.gradleup.shadow' version '8.3.6'
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
compileJava.options.release = 17
compileTestJava.options.release = 25

if (!hasProperty('mainClass')) {
    ext.mainClass = 'xyz.melodysky.cli.J2llCli'
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    runtimeLoader {
        java.srcDirs = ['src/runtimeLoader/java']
        resources.srcDirs = []
    }
    dummy {
        java.srcDirs = ['src/dummy/main/java']
        resources.srcDirs = ['src/dummy/main/resources']
    }
    bench {
        java.srcDirs = ['obfuscator/bench/src/main/java']
        resources.srcDirs = ['obfuscator/bench/src/main/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-analysis:9.8'
    implementation 'org.ow2.asm:asm-tree:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'
    implementation 'org.fusesource.jansi:jansi:2.4.1'
    implementation 'com.rfksystems:blake2b:2.0.0'

    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.4.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.4.2'
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName.set('j2ll.jar')
    destinationDirectory.set(layout.buildDirectory.dir('cli'))
    manifest {
        attributes(
                'Main-Class': getProperty('mainClass'),
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

assemble.dependsOn(shadowJar)

tasks.register('cliJar') {
    group = 'distribution'
    description = 'Builds the runnable j2ll CLI jar at build/cli/j2ll.jar.'
    dependsOn(shadowJar)
    outputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
}

tasks.register('distJ2ll', Sync) {
    group = 'distribution'
    description = 'Assembles the beta j2ll distribution at build/dist/j2ll.'
    dependsOn('cliJar')
    into layout.buildDirectory.dir('dist/j2ll')
    from(tasks.named('shadowJar').flatMap { it.archiveFile }) {
        rename { 'j2ll.jar' }
    }
    from('docs/config.schema.json') {
        into 'docs'
    }
    from('docs/examples') {
        into 'docs/examples'
    }
    from('docs/samples') {
        into 'docs/samples'
    }
    from('docs/io-config-output-contract.md') {
        into 'docs'
    }
    from('docs/getting-started.md') {
        into 'docs'
    }
    from('docs/java-support-tiers.md') {
        into 'docs'
    }
    from('docs/protection-obfuscation.md') {
        into 'docs'
    }
    from('docs/native-hardening-attacker-validation.md') {
        into 'docs'
    }
    from('docs/rewrite-roadmap.md') {
        into 'docs'
    }
    from('docs/pipeline/README.md') {
        into 'docs/pipeline'
    }
    from('README.md')
}

tasks.named('compileDummyJava', JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('buildDummy', Jar) {
    group = 'verification'
    description = 'Builds the Dummy feature-zoo fixture JAR at build/dummy/Dummy.jar.'
    dependsOn('dummyClasses')
    archiveFileName.set('Dummy.jar')
    destinationDirectory.set(layout.buildDirectory.dir('dummy'))
    from sourceSets.dummy.output
    manifest {
        attributes(
                'Main-Class': 'zoo.Main',
                'Multi-Release': 'true'
        )
    }
    from(sourceSets.dummy.output.classesDirs) {
        include 'zoo/versioned/VersionedFeature.class'
        into 'META-INF/versions/17'
    }
}

tasks.register('dTestBasic', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in basic mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyBasicRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

tasks.register('dTestAdvanced', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in advanced mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyAdvancedRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

tasks.register('dummyTest', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in all mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyAllRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

tasks.register('dTestMethodInternalization', Test) {
    group = 'verification'
    description = 'Runs public/protected method-internalization removal and runtime parity against Dummy fixtures.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyMethodInternalizationE2eTest.currentJarOnlyPublicStaticRemovalKeepsDummyParity'
        includeTestsMatching 'xyz.melodysky.pipeline.DummyMethodInternalizationE2eTest.declaredClosedWorldRemovesNonFinalPublicAndProtectedTargetsWithParity'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

['dTestBasic', 'dTestAdvanced', 'dummyTest', 'dTestMethodInternalization'].each { taskName ->
    tasks.named(taskName, Test) {
        testLogging {
            events = ['failed']
            exceptionFormat = 'full'
            showStandardStreams = true
        }
        systemProperty 'j2ll.dummy.workspaceRoot', layout.buildDirectory.dir('dummy/j2ll').get().asFile.absolutePath
        addTestListener(new TestListener() {
            @Override
            void beforeSuite(TestDescriptor suite) {}

            @Override
            void afterSuite(TestDescriptor suite, TestResult result) {}

            @Override
            void beforeTest(TestDescriptor testDescriptor) {}

            @Override
            void afterTest(TestDescriptor testDescriptor, TestResult result) {
                if (result.resultType == TestResult.ResultType.FAILURE && result.exception != null) {
                    println(result.exception.message)
                }
            }
        })
    }
}

tasks.named('compileRuntimeLoaderJava', JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
    // Keep the generated Loader independent from invokedynamic bootstrap
    // metadata so pruning the optional MethodHandles fallback bridge also
    // removes its constant-pool surface completely.
    options.compilerArgs.add('-XDstringConcat=inline')
}

tasks.named('processResources') {
    dependsOn(tasks.named('compileRuntimeLoaderJava'))
    from(sourceSets.runtimeLoader.output.classesDirs) {
        include 'xyz/melodysky/runtime/loader/LoaderTemplate.class'
    }
}

tasks.register('betaAcceptance', Test) {
    group = 'verification'
    description = 'Runs the beta acceptance smoke against build/dist/j2ll/j2ll.jar.'
    dependsOn('testClasses', 'distJ2ll')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.cli.BetaAcceptanceTest'
    }
    environment 'JAVA_HOME', System.getProperty('java.home')
    addTestListener(new TestListener() {
        @Override
        void beforeSuite(TestDescriptor suite) {}

        @Override
        void afterSuite(TestDescriptor suite, TestResult result) {
            if (suite.parent == null && (result.skippedTestCount > 0 || result.testCount == 0)) {
                throw new GradleException(
                        "betaAcceptance must execute without skips (tests=${result.testCount}, skipped=${result.skippedTestCount})")
            }
        }

        @Override
        void beforeTest(TestDescriptor testDescriptor) {}

        @Override
        void afterTest(TestDescriptor testDescriptor, TestResult result) {}
    })
}

tasks.named('betaAcceptance') {
    mustRunAfter(tasks.named('test'))
}

jar {
    manifest {
        attributes(
                'Main-Class': getProperty('mainClass'),
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.register('benchJar', Jar) {
    archiveBaseName.set('obf-bench')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('bench-libs'))
    from sourceSets.bench.output
    manifest.attributes("Main-Class": "bench.ObfBenchMain")
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group + ".nativeobfuscator"
            artifactId = project.name
            version = project.version
            from components.java
        }
    }
}

ConcurrentHashMap<TestDescriptor, StringBuffer> testOutputs = new ConcurrentHashMap<>()

test {
    dependsOn(shadowJar, distJ2ll)
    useJUnitPlatform()
    environment 'JAVA_HOME', System.getProperty('java.home')

    String configuredRealZig = System.getProperty('j2ll.realZig')
    if (configuredRealZig != null && !configuredRealZig.isBlank()) {
        systemProperty 'j2ll.realZig', configuredRealZig
    }

    maxParallelForks = Math.max(1, Math.min(Runtime.runtime.availableProcessors(), 32))

    testLogging {
        events = []
    }

    addTestListener(new TestListener() {
        @Override
        void beforeSuite(TestDescriptor suite) {}

        @Override
        void afterSuite(TestDescriptor suite, TestResult result) {}

        @Override
        void beforeTest(TestDescriptor descriptor) {
            testOutputs.put(descriptor, new StringBuffer())
        }

        @Override
        void afterTest(TestDescriptor descriptor, TestResult result) {
            StringBuffer output = testOutputs.remove(descriptor)
            String descriptorKey = (descriptor.className == null ? "" : descriptor.className + ".") +
                    descriptor.displayName
            String color = ""
            String reset = ""
            if (System.getenv("CI")) {
                if (result.resultType == TestResult.ResultType.SUCCESS)
                    color = "\u001b[1;32m"
                if (result.resultType == TestResult.ResultType.FAILURE)
                    color = "\u001b[1;31m"
                if (result.resultType == TestResult.ResultType.SKIPPED)
                    color = "\u001b[1;34m"
                reset = "\u001b[0m"
            }
            System.out.println(color + "Test \"" + descriptorKey + "\" -> " + result.resultType
                    + " in " + (result.endTime - result.startTime) + "ms" + reset)
            if (result.getResultType() == TestResult.ResultType.FAILURE) {
                StringBuilder failureLog = new StringBuilder("Test fail log for \"")
                        .append(descriptorKey).append("\"\n")
                if (output != null) {
                    failureLog.append(output)
                }
                System.out.print(failureLog)
            }
        }
    })

    addTestOutputListener(new TestOutputListener() {
        @Override
        void onOutput(TestDescriptor descriptor, TestOutputEvent event) {
            testOutputs.computeIfAbsent(descriptor, ignored -> new StringBuffer())
                    .append("[")
                    .append(event.getDestination().toString().toUpperCase()).append("] ").append(event.getMessage())
        }
    })
}

tasks.register('obfBench', Exec) {
    dependsOn(shadowJar, benchJar)

    String shellExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'powershell' : 'pwsh'
    commandLine shellExecutable,
            '-ExecutionPolicy', 'Bypass',
            '-File', file('scripts/run-obf-bench.ps1').absolutePath,
            '-WorkspaceRoot', file("$buildDir/obf-bench").absolutePath,
            '-BenchJarPath', tasks.named('benchJar').get().archiveFile.get().asFile.absolutePath,
            '-SkipObfuscatorBuild'
}
