import java.util.concurrent.ConcurrentHashMap

plugins {
    id 'com.gradleup.shadow' version '8.3.6'
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
[compileJava, compileTestJava]*.options*.release = 25

if (!hasProperty('mainClass')) {
    ext.mainClass = 'xyz.melodysky.cli.J2llCli'
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    dummy {
        java.srcDirs = ['src/dummy/main/java']
        resources.srcDirs = ['src/dummy/main/resources']
    }
    bench {
        java.srcDirs = ['obfuscator/bench/src/main/java']
        resources.srcDirs = ['obfuscator/bench/src/main/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-analysis:9.8'
    implementation 'org.ow2.asm:asm-tree:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'
    implementation 'org.fusesource.jansi:jansi:2.4.1'
    implementation 'com.rfksystems:blake2b:2.0.0'

    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.4.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.4.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.4.2'
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName.set('j2ll.jar')
    destinationDirectory.set(layout.buildDirectory.dir('cli'))
    manifest {
        attributes(
                'Main-Class': getProperty('mainClass'),
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

assemble.dependsOn(shadowJar)

tasks.register('cliJar') {
    group = 'distribution'
    description = 'Builds the runnable j2ll CLI jar at build/cli/j2ll.jar.'
    dependsOn(shadowJar)
    outputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
}

tasks.register('distJ2ll', Sync) {
    group = 'distribution'
    description = 'Assembles the beta j2ll distribution at build/dist/j2ll.'
    dependsOn('cliJar')
    into layout.buildDirectory.dir('dist/j2ll')
    from(tasks.named('shadowJar').flatMap { it.archiveFile }) {
        rename { 'j2ll.jar' }
    }
    from('docs/config.schema.json') {
        into 'docs'
    }
    from('docs/examples') {
        into 'docs/examples'
    }
    from('docs/samples') {
        into 'docs/samples'
    }
    from('docs/io-config-output-contract.md') {
        into 'docs'
    }
    from('docs/getting-started.md') {
        into 'docs'
    }
    from('AGENTS.md') {
        rename { 'README.md' }
    }
}

tasks.named('compileDummyJava', JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('buildDummy', Jar) {
    group = 'verification'
    description = 'Builds the Dummy feature-zoo fixture JAR at build/dummy/Dummy.jar.'
    dependsOn('dummyClasses')
    archiveFileName.set('Dummy.jar')
    destinationDirectory.set(layout.buildDirectory.dir('dummy'))
    from sourceSets.dummy.output
    manifest {
        attributes(
                'Main-Class': 'zoo.Main'
        )
    }
}

tasks.register('dTestBasic', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in basic mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyBasicRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

tasks.register('dTestAdvanced', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in advanced mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyAdvancedRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

tasks.register('dummyTest', Test) {
    group = 'verification'
    description = 'Runs j2ll against Dummy.jar in all mode.'
    dependsOn('buildDummy', 'testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.pipeline.DummyE2eTest.dummyAllRunsThroughJ2ll'
    }
    systemProperty 'j2ll.dummy.jar', tasks.named('buildDummy').flatMap { it.archiveFile }.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
}

['dTestBasic', 'dTestAdvanced', 'dummyTest'].each { taskName ->
    tasks.named(taskName, Test) {
        testLogging {
            events 'failed'
            exceptionFormat 'full'
            showStandardStreams = true
        }
        systemProperty 'j2ll.dummy.workspaceRoot', layout.buildDirectory.dir('dummy/j2ll').get().asFile.absolutePath
        afterTest { descriptor, result ->
            if (result.resultType == TestResult.ResultType.FAILURE && result.exception != null) {
                println(result.exception.message)
            }
        }
    }
}

tasks.register('betaAcceptance', Test) {
    group = 'verification'
    description = 'Runs the beta acceptance smoke against build/dist/j2ll/j2ll.jar.'
    dependsOn('testClasses', 'distJ2ll')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'xyz.melodysky.cli.BetaAcceptanceTest'
    }
    environment 'JAVA_HOME', System.getProperty('java.home')
}

jar {
    manifest {
        attributes(
                'Main-Class': getProperty('mainClass'),
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.register('benchJar', Jar) {
    archiveBaseName.set('obf-bench')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('bench-libs'))
    from sourceSets.bench.output
    manifest.attributes("Main-Class": "bench.ObfBenchMain")
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group + ".nativeobfuscator"
            artifactId project.name
            version project.version
            from components.java
        }
    }
}

ConcurrentHashMap<String, StringBuilder> testOutputs = new ConcurrentHashMap<>()

test {
    dependsOn(shadowJar, distJ2ll)
    useJUnitPlatform()
    environment 'JAVA_HOME', System.getProperty('java.home')

    maxParallelForks = Math.max(Runtime.runtime.availableProcessors(), 32)

    testLogging {
        events = []
    }

    beforeTest { descriptor ->
        if (System.getenv("CI"))
            System.out.print("\u001b[1;33m")
        testOutputs.put(descriptor.getName(), new StringBuilder())
        System.out.print("Running test \"" + descriptor.getDisplayName() + "\" -> ")
        System.out.flush()
    }

    afterTest { descriptor, result ->
        if (System.getenv("CI")) {
            if (result.getResultType() == TestResult.ResultType.SUCCESS)
                System.out.print("\u001b[1;32m")
            if (result.getResultType() == TestResult.ResultType.FAILURE)
                System.out.print("\u001b[1;31m")
            if (result.getResultType() == TestResult.ResultType.SKIPPED)
                System.out.print("\u001b[1;34m")
        }
        System.out.print(result.getResultType().toString())
        if (System.getenv("CI"))
            System.out.print("\u001b[1;33m")
        System.out.println(" in " + ((result.getEndTime()) - (result.getStartTime())) + "ms")
        if (result.getResultType() == TestResult.ResultType.FAILURE) {
            if (System.getenv("CI")) {
                System.out.print("\u001b[1;31m")
            }
            System.out.println("Test fail log")
            System.out.print(testOutputs.get(descriptor.getName()).toString())
            testOutputs.remove(descriptor.getName())
        }
    }

    onOutput { descriptor, event ->
        if (!testOutputs.containsKey(descriptor.getName()))
            testOutputs.put(descriptor.getName(), new StringBuilder())
        testOutputs.get(descriptor.getName()).append("[")
                .append(event.getDestination().toString().toUpperCase()).append("] ").append(event.getMessage())
    }
}

tasks.register('obfBench', Exec) {
    dependsOn(shadowJar, benchJar)

    String shellExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'powershell' : 'pwsh'
    commandLine shellExecutable,
            '-ExecutionPolicy', 'Bypass',
            '-File', file('scripts/run-obf-bench.ps1').absolutePath,
            '-WorkspaceRoot', file("$buildDir/obf-bench").absolutePath,
            '-BenchJarPath', tasks.named('benchJar').get().archiveFile.get().asFile.absolutePath,
            '-SkipObfuscatorBuild'
}
